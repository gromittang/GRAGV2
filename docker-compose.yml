version: '3.8'

services:
  wmsrag-v2:
    build: .
    image: wmsrag-v2:latest
    container_name: wmsrag-v2-app
    ports:
      - "8812:8812"
    volumes:
      - wmsrag-v2-data:/app/data
      - ${RERANKER_MODEL_HOST_PATH:-/data/models/bge-reranker-v2-m3}:/app/models/bge-reranker-v2-m3:ro
      - ${EMBEDDING_MODEL_HOST_PATH:-/data/models/bge-small-zh-v1.5}:/app/models/bge-small-zh-v1.5:ro
    environment:
      - DATA_DIR=/app/data
      - APP_ENV=production
      - SERVER_PORT=8812
      # LLM 配置
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # Embedding 配置
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cpu}
      # 行业配置
      - INDUSTRY_TYPE=${INDUSTRY_TYPE:-general}
      - RERANKER_MODEL_PATH=/app/models/bge-reranker-v2-m3
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # MySQL 配置（Data Copilot）
      - MYSQL_HOST=${MYSQL_HOST:-localhost}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-wms}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8812/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  wmsrag-v2-data:
    name: wmsrag-v2-data